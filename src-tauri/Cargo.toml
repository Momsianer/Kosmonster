[package]
name = "kosmonster"
version = "1.0.0"
description = "Kosmonster: Weltraum Idle/Clicker Spiel über das Sammeln mathematischer Sternmonster"
authors = ["Moritz"]
license = "UNLICENSED"
repository = "https://github.com/Momsianer/Kosmonster"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kosmonster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
